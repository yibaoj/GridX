[general]
output_root = "outputs/standard"
canonical_crs = "EPSG:4326"

[datasets.spatial]
processor = "spatial"
source_ids = ["province_boundaries", "china_eez_marine_regions"]
output = "spatial.parquet"

[datasets.network]
processor = "network"
source_ids = ["osm_china_pbf"]
output = "network"

[datasets.network.options]
feature_layer = "power_features"
preparation_script = "prepare_osm_power_network.sh"
feature_output_prefix = "data/osm/china-power-network"
reference_cache = "outputs/standard/cache/osm_power_ways.osm.pbf"
require_line_voltage = false
anomalous_frequencies_hz = [60.0]
# Classifies an already identified OSM station as transmission/distribution;
# it never promotes a line terminal to station.
transmission_voltage_threshold_kv = 220.0
station_tolerance_m = 500.0
line_endpoint_tolerance_m = 1.0
fallback_voltage_kv = 220.0
default_circuits = 1.0
ac_cables_per_circuit = 3.0
dc_cables_per_circuit = 2.0
metric_crs = "+proj=aea +lat_1=25 +lat_2=47 +lat_0=0 +lon_0=105 +datum=WGS84 +units=m +no_defs"
include_statuses = []

[datasets.generation]
processor = "generation"
source_ids = ["gem_integrated_power"]
output = "generation.parquet"

[datasets.generation.options]
sheet = "Power facilities"
country_areas = ["China", "China mainland"]
include_statuses = []
observed_at = "2026-03"
class_mapping_file = "config/class_mapping.csv"

[datasets.storage]
processor = "storage"
source_ids = ["gem_integrated_power", "doe_storage"]
output = "storage.parquet"

[datasets.storage.options]
gem_sheet = "Power facilities"
country_areas = ["China", "China mainland"]
gem_statuses = []
doe_country = "China"
doe_statuses = []
gem_observed_at = "2026-03"
doe_observed_at = "2022"
class_mapping_file = "config/class_mapping.csv"

[datasets.parameter]
processor = "parameter"
source_ids = [
  "pypsa_technology_costs",
  "technical_economic_assumptions",
  "operational_assumptions",
  "pandapower_standard_types",
  "china_fuel_prices_2025",
  "opal_rt_line_assumptions",
]
outputs = { data = "parameter.parquet", report = "parameter_validation_report.json" }

[datasets.parameter.options]
technology_data_source_id = "pypsa_technology_costs"
technical_assumptions_source_id = "technical_economic_assumptions"
supplemental_source_ids = [
  "operational_assumptions",
  "pandapower_standard_types",
  "china_fuel_prices_2025",
]
line_assumptions_source_id = "opal_rt_line_assumptions"
pypsa_year = 2025
default_priority = 100
conflict_tolerance = 1e-6
name_aliases = {}
quality_order = [
  "official_observation",
  "source",
  "standard_type_proxy",
  "derived",
  "generic",
  "interpolated",
  "proxy",
  "low",
  "model_default",
]

[datasets.load]
processor = "load"
source_ids = ["provincial_hourly_load"]
output = "load.nc"

[datasets.load.options]
years = [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
timezone = "Asia/Shanghai"
interval = "1h"

[datasets.population]
processor = "population"
source_ids = ["worldpop_population"]
output = "population.parquet"

[datasets.population.options]
aggregation_factor = 30
observed_at = "2020"
valid_from = "2020"

[datasets.resource]
processor = "resource"
source_ids = ["era5_china_2024"]
output = "resource.nc"

[datasets.resource.options]
time_step = "1h"
onshore_turbine = "NREL_ReferenceTurbine_2020ATB_5.5MW"
offshore_turbine = "NREL_ReferenceTurbine_2020ATB_15MW_offshore"
wind_interpolation_method = "logarithmic"
wind_smooth_power_curve = false
solar_panel = "CSi"
solar_orientation = "latitude_optimal"
solar_tracking = "none"
solar_clearsky_model = "enhanced"
run_of_river_smoothing_hours = 24
run_of_river_design_quantile = 0.75
run_of_river_environmental_flow_fraction = 0.10
