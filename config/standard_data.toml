[general]
output_root = "outputs/standard"
canonical_crs = "EPSG:4326"

[datasets.spatial]
processor = "spatial"
source_ids = ["province_boundaries"]
output = "spatial.parquet"

[datasets.network]
processor = "network"
source_ids = ["osm_china_pbf"]
outputs = { nodes = "network_nodes.parquet", branches = "network_branches.parquet" }

[datasets.network.options]
feature_layer = "power_features"
preparation_script = "prepare_osm_power_network.sh"
feature_output_prefix = "data/osm/china-power-network"
reference_cache = "outputs/standard/cache/osm_power_ways.osm.pbf"
require_line_voltage = true
station_tolerance_m = 500.0
line_endpoint_tolerance_m = 1.0
metric_crs = "+proj=aea +lat_1=25 +lat_2=47 +lat_0=0 +lon_0=105 +datum=WGS84 +units=m +no_defs"
include_statuses = []

[datasets.generation]
processor = "generation"
source_ids = ["gem_integrated_power"]
output = "generation.parquet"

[datasets.generation.options]
sheet = "Power facilities"
country_areas = ["China", "China mainland"]
include_statuses = []
observed_at = "2026-03"
class_mapping_file = "config/class_mapping.csv"

[datasets.storage]
processor = "storage"
source_ids = ["gem_integrated_power", "doe_storage"]
output = "storage.parquet"

[datasets.storage.options]
gem_sheet = "Power facilities"
country_areas = ["China", "China mainland"]
gem_statuses = []
doe_country = "China"
doe_statuses = []
gem_observed_at = "2026-03"
doe_observed_at = "2022"
class_mapping_file = "config/class_mapping.csv"

[datasets.parameter]
processor = "parameter"
source_ids = ["pypsa_technology_costs"]
output = "parameter.parquet"

[datasets.parameter.options]
assumptions_file = "config/technical_economic_assumptions.csv"
pypsa_year = 2025

[datasets.load]
processor = "load"
source_ids = ["provincial_hourly_load"]
output = "load.nc"

[datasets.load.options]
years = [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
timezone = "Asia/Shanghai"
interval = "1h"

[datasets.population]
processor = "population"
source_ids = ["worldpop_population"]
output = "population.parquet"

[datasets.population.options]
aggregation_factor = 30
observed_at = "2020"
valid_from = "2020"

[datasets.resource]
processor = "resource"
source_ids = ["era5_china_2024"]
output = "resource.nc"

[datasets.resource.options]
year = 2024
time_step = "1h"
onshore_turbine = "NREL_ReferenceTurbine_2020ATB_5.5MW"
offshore_turbine = "NREL_ReferenceTurbine_2020ATB_15MW_offshore"
solar_panel = "CSi"
solar_orientation = "latitude_optimal"
run_of_river_mean_pu = 0.45
reservoir_mean_pu = 0.55
