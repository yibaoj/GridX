[site]
title = "GridX"
title_zh = "网探"
subtitle = "Power system observatory"

[server]
host = "127.0.0.1"
port = 8765

[data]
standard_config = "config/standard_data.toml"
mapping_config = "config/mapping.toml"
case_config = "config/case.toml"
uc_config = "config/uc.toml"
output_root = "outputs/web"
plot_year = 2024
geometry_simplify_degrees = 0.01

[map]
center = [35.5, 104.0]
zoom = 4
min_zoom = 3
max_zoom = 10
tile_url = "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"
tile_attribution = "&copy; OpenStreetMap contributors &copy; CARTO"
default_stage = "standard"
default_layer = "generator"

[[stages]]
id = "standard"
label = "标准层"
description = "数据规范"
icon = "database"

[[stages]]
id = "mapping"
label = "映射层"
description = "时空统一"
icon = "workflow"

[[stages]]
id = "case"
label = "算例层"
description = "系统算例"
icon = "cpu"

[[stages]]
id = "application"
label = "应用层"
description = "运行模拟"
icon = "activity"

[[layers]]
id = "generator"
label = "发电"
icon = "factory"
unit = "MW"

[[layers]]
id = "storage"
label = "储能"
icon = "battery-charging"
unit = "MW"

[[layers]]
id = "network"
label = "网络"
icon = "network"
unit = "kV"

[[layers]]
id = "load"
label = "负荷"
icon = "gauge"
unit = "MW"

[[layers]]
id = "resource"
label = "资源"
icon = "wind"
unit = "p.u."

[[layers]]
id = "population"
label = "人口"
icon = "users"
unit = "人"

[[news]]
date = "2026-08-07"
title = "网站绘图数据完成离线化"
content = "三层地图共用后端统计口径，网络与年度时序无需请求时计算。"

[[news]]
date = "2026-08-06"
title = "算例与应用输出完成解耦"
content = "算例可直接加载，生产模拟保存逐设备时序。"

[[news]]
date = "2026-08-05"
title = "负荷映射校验完善"
content = "辅助权重、总量守恒和节点覆盖进入统一检查。"

[[news]]
date = "2026-08-03"
title = "海陆空间范围统一"
content = "行政边界与海洋功能区进入同一空间数据集。"

[[news]]
date = "2026-08-02"
title = "参数契约接入PyPSA"
content = "技术经济参数的单位、转换和缺失检查统一管理。"
