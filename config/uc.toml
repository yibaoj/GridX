[general]
output_root = "outputs/app/uc"
strict_case = false
commitment_mode = "continuous"
default_start = "2025-01-01 00:00"
default_end = "2025-12-31 23:00"
dispatch_tolerance_mw = 0.001
solve_mode = "single" # "rolling_horizon"
rolling_horizon_hours = 12
rolling_overlap_hours = 0

[storage]
initial_soc_pu = 0.5 # Fraction of p_nom * max_hours before the first interval.
final_soc_pu = 0.5 # Exact SOC after the last interval of the full simulation.

[reliability]
enabled = true
cost_eur_per_mwh = 10000.0
capacity_multiplier = 1.2

[solver]
name = "copt"
method = "ipm"
time_limit_s = 2000.0
mip_gap = 0.01
log_to_console = false
