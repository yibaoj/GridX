[general]
output_root = "outputs/app/uc"
strict_case = false
commitment_mode = "continuous"
default_start = "2024-05-01 00:00"
default_end = "2024-08-31 23:00"
dispatch_tolerance_mw = 0.001
solve_mode = "single" # "rolling_horizon"
rolling_horizon_hours = 12
rolling_overlap_hours = 0

[reliability]
enabled = true
cost_eur_per_mwh = 10000.0
capacity_multiplier = 1.2

[solver]
name = "highs"
method = "ipm"
time_limit_s = 300.0
mip_gap = 0.01
log_to_console = false
