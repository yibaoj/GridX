[general]
output_root = "outputs/mapping"
metric_crs = "+proj=aea +lat_1=25 +lat_2=47 +lat_0=0 +lon_0=105 +datum=WGS84 +units=m +no_defs"
timezone = "Asia/Shanghai"
time_step = "1h"
random_seed = 42

[cell]
kind = "square"
# Build 50 km metric squares, then clip them by the selected spatial levels.
levels = ["province", "marine_zone"]
size_km = 50.0
polygon_file = ""
level_priority = ["province", "marine_zone"]
# The current load source covers mainland China's 31 provincial regions.
exclude_admin_uids = [
  "province_boundaries:710000",
  "province_boundaries:810000",
  "province_boundaries:820000",
]
same_level_overlap_tolerance_km2 = 1.0
minimum_area_km2 = 5.0

[spatial_mapping.load]
# Load is extensive. "linear" uses area weights; "auxiliary" always
# normalizes the configured auxiliary values over every covered target cell.
method = "auxiliary"
auxiliary_dataset = "population"
auxiliary_value = "population"
# Positive auxiliary cells outside a load polygon, such as clipped nearshore
# cells, join the nearest source polygon before source-wise normalization.
uncovered_auxiliary_nearest_levels = ["marine_zone"]
# Optional quality gate: require the raw auxiliary support to be finer than
# the standard cells before aggregation. It does not determine scale direction.
auxiliary_must_be_finer = true
conservation_tolerance = 0.005

[spatial_mapping.resource]
# Resource availability is intensive; "linear" applies overlap-area averaging
# in either scale direction. Width and height describe point-based source cells.
method = "linear"
source_cell_width_degrees = 0.25
source_cell_height_degrees = 0.25

[network]
bus_subclasses = ["station_bus"]

[asset_bus_mapping]
generator_method = "geometry"
storage_method = "geometry"
prefer_same_admin = true
voltage_preference = "high"

[load_bus_mapping]
method = "geometry"
prefer_same_admin = true
voltage_preference = "high"

[outputs]
spatial = "spatial.parquet"
population = "population.parquet"
load = "load.nc"
resource = "resource.nc"
network = "network"
generator = "generator.parquet"
storage = "storage.parquet"
